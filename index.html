<style>
:root{
  --ground:#EFEFEA;
  --surface:#FFFFFF;
  --surface-2:#F6F6F2;
  --ink:#1A2233;
  --muted:#5E6675;
  --faint:#8A909C;
  --rule:#D9D9D2;
  --rule-soft:#E7E7E1;
  --accent:#1E3A6E;
  --accent-soft:#E4E9F3;
  --on-accent:#FFFFFF;
  --wrong:#B23A2F;
  --wrong-soft:#F7E6E3;
  --right:#2F6B4F;
  --right-soft:#E3EFE8;
  --amber:#8A6212;
  --amber-soft:#F4ECDA;

  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141821;
    --surface:#1C2130;
    --surface-2:#232937;
    --ink:#E9EAE6;
    --muted:#9BA3B2;
    --faint:#78808F;
    --rule:#2E3546;
    --rule-soft:#262C3A;
    --accent:#8FAEE0;
    --accent-soft:#232C3F;
    --on-accent:#141821;
    --wrong:#E89A8E;
    --wrong-soft:#332422;
    --right:#84C7A2;
    --right-soft:#1F2E28;
    --amber:#D8AC4E;
    --amber-soft:#2E2820;
  }
}
:root[data-theme="dark"]{
  --ground:#141821;
  --surface:#1C2130;
  --surface-2:#232937;
  --ink:#E9EAE6;
  --muted:#9BA3B2;
  --faint:#78808F;
  --rule:#2E3546;
  --rule-soft:#262C3A;
  --accent:#8FAEE0;
  --accent-soft:#232C3F;
  --on-accent:#141821;
  --wrong:#E89A8E;
  --wrong-soft:#332422;
  --right:#84C7A2;
  --right-soft:#1F2E28;
  --amber:#D8AC4E;
  --amber-soft:#2E2820;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:0 64px}

/* ---------- header ---------- */
header{padding-block:30px 18px}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{
  font-family:var(--serif);
  font-size:clamp(30px,6vw,42px);
  font-weight:600;
  line-height:1;
  margin:0;
  letter-spacing:-.015em;
  text-wrap:balance;
}
.sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:52ch}
.streak{
  display:flex;align-items:baseline;gap:8px;
  border:1px solid var(--rule);background:var(--surface);
  padding:8px 14px;border-radius:2px;white-space:nowrap;
}
.streak b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.streak span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ---------- nav ---------- */
nav{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-block:22px 26px;
  padding-bottom:18px;border-bottom:2px solid var(--ink);
}
nav button{
  font-family:var(--sans);font-size:13px;font-weight:500;
  letter-spacing:.02em;
  padding:7px 14px;border:1px solid var(--rule);
  background:var(--surface);color:var(--muted);
  border-radius:2px;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
nav button:hover{color:var(--ink);border-color:var(--faint)}
nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- generic ---------- */
h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--sans);font-size:15px;font-weight:600;margin:0 0 6px}
p{margin:0 0 12px;max-width:66ch}
.lead{color:var(--muted);font-size:14px;margin-bottom:24px;max-width:64ch}
.eyebrow{
  font-family:var(--mono);font-size:11px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--faint);margin-bottom:8px;
}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
hr.rule{border:0;border-top:1px solid var(--rule-soft);margin:26px 0}
.section-view[hidden]{display:none!important}

/* ---------- buttons ---------- */
button.btn{
  font-family:var(--sans);font-size:14px;font-weight:500;
  padding:9px 16px;border-radius:2px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
  transition:opacity .12s;
}
button.btn:hover{opacity:.88}
button.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
button.btn.ghost:hover{border-color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}
button.mini{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;background:transparent;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;cursor:pointer;
}
button.mini:hover{color:var(--ink);border-color:var(--faint)}

input[type=text],textarea{
  font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--rule);
  border-radius:2px;padding:10px 12px;width:100%;
}
textarea{min-height:140px;line-height:1.6;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--accent);outline:none}
label.fld{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}

/* ---------- today ---------- */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:8px}
.block{
  border:1px solid var(--rule);background:var(--surface);
  border-radius:3px;padding:16px;
  display:flex;flex-direction:column;gap:8px;
  text-align:left;cursor:pointer;font:inherit;color:inherit;
}
.block:hover{border-color:var(--accent)}
.block .min{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.block .ttl{font-family:var(--serif);font-size:20px;font-weight:600}
.block .why{font-size:13px;color:var(--muted);line-height:1.45}
.block .state{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  margin-top:auto;padding-top:6px;color:var(--faint);
}
.block[data-done="1"]{background:var(--right-soft);border-color:var(--right)}
.block[data-done="1"] .state{color:var(--right)}

.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.tally div{background:var(--surface);padding:12px 14px}
.tally b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.tally span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* ---------- grammar / dictionary ---------- */
.entry{border-bottom:1px solid var(--rule-soft);padding:16px 0}
.entry:last-child{border-bottom:0}
.entry summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.entry summary::-webkit-details-marker{display:none}
.headword{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
.pos{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--faint)}
.seen{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--right);margin-left:auto}
.entry .body{padding-top:12px;display:flex;flex-direction:column;gap:12px}
.rule-txt{font-size:15px;max-width:64ch}
.es-note{
  font-family:var(--serif);font-style:italic;font-size:15px;
  color:var(--muted);border-left:2px solid var(--accent);
  padding-left:12px;max-width:62ch;
}
ul.ex{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px}
ul.ex li{font-size:15px;padding-left:20px;position:relative;max-width:64ch}
ul.ex li::before{position:absolute;left:0;font-family:var(--mono);font-size:13px}
ul.ex li.ok::before{content:"✓";color:var(--right)}
ul.ex li.no::before{content:"✗";color:var(--wrong)}
ul.ex li.no{color:var(--muted)}
ul.ex li em{font-style:normal;font-weight:600;color:var(--accent)}
.drill{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px}
.drill .q{font-size:15px}
.drill .q b{font-family:var(--mono);font-weight:500;background:var(--accent-soft);padding:1px 8px;border-radius:2px}
.drill .fb{font-size:14px;min-height:1.4em}
.fb.good{color:var(--right)}
.fb.bad{color:var(--wrong)}
.drill input{max-width:240px}

/* ---------- dictation / diff ---------- */
.diff{font-family:var(--mono);font-size:14px;line-height:2;word-spacing:.1em}
.diff .keep{color:var(--ink)}
.diff .miss{background:var(--right-soft);color:var(--right);padding:2px 4px;border-radius:2px}
.diff .extra{background:var(--wrong-soft);color:var(--wrong);padding:2px 4px;border-radius:2px;text-decoration:line-through}
.score{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
.ctx-tag{
  font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  padding:3px 8px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);
}

/* ---------- reading ---------- */
.reader{font-family:var(--serif);font-size:18px;line-height:1.7;max-width:62ch}
.reader p{margin:0 0 14px;max-width:none}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 20px}
.gloss div{font-size:14px;padding:4px 0;border-bottom:1px dotted var(--rule)}
.gloss b{font-weight:600}
.gloss i{font-style:italic;color:var(--muted)}

/* ---------- interview ---------- */
.qa{border-left:2px solid var(--rule);padding-left:16px;margin-bottom:22px}
.qa .q{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:8px}
.qa .a{font-size:15px;line-height:1.65;max-width:64ch;margin-bottom:10px}
.qa .a strong{color:var(--accent);font-weight:600}
.qa .meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}

/* ---------- claude feedback ---------- */
.fbox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px}
.fbox .corrected{font-size:15px;line-height:1.65}
.fbox.local{border-color:var(--amber);background:var(--amber-soft)}
.note{display:flex;gap:10px;font-size:14px;padding:8px 0;border-top:1px dotted var(--rule)}
.note .x{color:var(--wrong);text-decoration:line-through;white-space:nowrap}
.note .v{color:var(--right);font-weight:600;white-space:nowrap}
.note .w{color:var(--muted);flex:1;min-width:140px}
.thinking{font-family:var(--mono);font-size:13px;color:var(--muted)}
.thinking::after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.warn{font-size:13px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber);border-radius:2px;padding:10px 12px}
.muted{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono)}
@media(max-width:520px){
  .wrap{padding-inline:16px}
  nav button{font-size:12px;padding:6px 11px}
}
</style>

/* --- Grammar: the confusables that break Spanish speakers --- */
const CONFUSABLES = [
{
  id:"another", head:"another / other / any other", pos:"det.",
  rule:"<em>another</em> es singular y nunca lleva artículo. <em>other</em> es plural, o va acompañado de the / my / some. <em>any other</em> aparece en preguntas, negativas y comparaciones.",
  es:"Regla rápida: si es singular y sin «the», es <b>another</b>. Si es plural, <b>other</b>.",
  ex:[
    {ok:1,t:"Can I have <em>another</em> coffee? (uno más)"},
    {ok:1,t:"<em>Other</em> companies pay better. (plural)"},
    {ok:1,t:"One offer is in Madrid, <em>the other</em> is in Boadilla."},
    {ok:1,t:"It's faster than <em>any other</em> laptop."},
    {ok:0,t:"I need <s>other</s> ticket. → I need <em>another</em> ticket."}
  ],
  drills:[
    {q:"I don't like this one. Show me ___ one.", a:["another"]},
    {q:"___ people were waiting outside.", a:["other"]},
    {q:"Is there ___ way to fix it?", a:["any other"]},
    {q:"I have two brothers. One is a nurse, ___ is a driver.", a:["the other"]}
  ]
},
{
  id:"needto", head:"need to / have to / want to", pos:"verb.",
  rule:"Después de <em>need</em>, <em>have</em>, <em>want</em>, <em>try</em>, <em>decide</em>, <em>hope</em> y <em>learn</em>, el verbo siguiente lleva SIEMPRE <em>to</em>.",
  es:"En español «necesito practicar» no lleva nada entre los dos verbos. En inglés siempre va <b>to</b>. Excepción: los modales (can, must, should, will, may) nunca lo llevan.",
  ex:[
    {ok:1,t:"I need <em>to</em> practise every day."},
    {ok:1,t:"I have <em>to</em> work tomorrow."},
    {ok:1,t:"I must go. / I can speak Spanish. (modal: sin «to»)"},
    {ok:0,t:"I need <s>practice</s> my English. → I need <em>to practise</em> my English."}
  ],
  drills:[
    {q:"I want ___ learn English for work.", a:["to"]},
    {q:"You should ___ (nothing / to) rest.  → escribe «nothing» o «to»", a:["nothing","-","nada"]},
    {q:"She decided ___ apply for the job.", a:["to"]}
  ]
},
{
  id:"reflex", head:"myself / yourself / himself", pos:"pron.",
  rule:"Cuando el sujeto y el objeto son la misma persona, el inglés usa un pronombre reflexivo completo: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.",
  es:"El español usa «me / te / se» delante del verbo. El inglés lo pone detrás y con palabra propia: <i>me obligo</i> → <b>I force myself</b>.",
  ex:[
    {ok:1,t:"I taught <em>myself</em> Python. (aprendí solo)"},
    {ok:1,t:"Force <em>yourself</em> to speak out loud."},
    {ok:1,t:"The system restarts <em>itself</em> at night."},
    {ok:0,t:"I force <s>me</s> to study. → I force <em>myself</em> to study."}
  ],
  drills:[
    {q:"He fixed the printer ___ .", a:["himself","by himself"]},
    {q:"We introduced ___ to the new team.", a:["ourselves"]},
    {q:"Did you do it ___ ?", a:["yourself","by yourself"]}
  ]
},
{
  id:"saytell", head:"say / tell / speak / talk", pos:"verb.",
  rule:"<em>say</em> + algo. <em>tell</em> + a alguien (+ algo). <em>speak / talk</em> + to somebody. <em>speak</em> + un idioma.",
  es:"En español «decir» sirve para todo. En inglés la diferencia es si mencionas a la persona: si la mencionas, <b>tell</b>; si no, <b>say</b>.",
  ex:[
    {ok:1,t:"He <em>told me</em> the truth."},
    {ok:1,t:"He <em>said</em> it was urgent."},
    {ok:1,t:"I need to <em>talk to</em> my manager."},
    {ok:1,t:"I <em>speak</em> Spanish and some English."},
    {ok:0,t:"He <s>said me</s> the truth. → He <em>told me</em> the truth."}
  ],
  drills:[
    {q:"Can you ___ me your name, please?", a:["tell"]},
    {q:"She ___ that the server was down.", a:["said"]},
    {q:"I'd like to ___ to the manager.", a:["speak","talk"]}
  ]
},
{
  id:"makedo", head:"make / do", pos:"verb.",
  rule:"<em>do</em> = tareas, trabajo, obligaciones y cosas indefinidas. <em>make</em> = crear, producir o fabricar algo nuevo.",
  es:"Los dos son «hacer». Se aprenden por colocación, no por lógica: <b>do</b> the work, the homework, a course, business, research, a favour. <b>make</b> a decision, a mistake, a call, money, progress, an appointment, sure.",
  ex:[
    {ok:1,t:"I <em>made</em> a mistake in the configuration."},
    {ok:1,t:"Please <em>make sure</em> you back up your files."},
    {ok:1,t:"I <em>do</em> the maintenance every Friday."},
    {ok:0,t:"I <s>did</s> a mistake. → I <em>made</em> a mistake."}
  ],
  drills:[
    {q:"We need to ___ a decision today.", a:["make"]},
    {q:"Could you ___ me a favour?", a:["do"]},
    {q:"The team is ___ good progress.", a:["making"]}
  ]
},
{
  id:"forsince", head:"for / since / ago", pos:"prep.",
  rule:"<em>for</em> + duración. <em>since</em> + punto de inicio. <em>ago</em> + cantidad de tiempo hacia atrás, y siempre con pasado simple.",
  es:"«Desde hace dos años» = <b>for two years</b>, no «since two years». «Desde 2024» = <b>since 2024</b>. «Hace dos años» = <b>two years ago</b>.",
  ex:[
    {ok:1,t:"I've worked here <em>for</em> six months."},
    {ok:1,t:"I've worked here <em>since</em> March."},
    {ok:1,t:"I finished the course two months <em>ago</em>."},
    {ok:0,t:"I work here <s>since two years</s>. → I've worked here <em>for two years</em>."}
  ],
  drills:[
    {q:"I've been living in Madrid ___ 2019.", a:["since"]},
    {q:"She has been in IT ___ five years.", a:["for"]},
    {q:"I sent the email ten minutes ___ .", a:["ago"]}

},
{
  id:"perfect", head:"present perfect / past simple", pos:"tense.",
  rule:"Pasado simple = tiempo TERMINADO y normalmente dicho (yesterday, in 2025, last month). Present perfect = tiempo no terminado, sin fecha, o con efecto en el presente.",
  es:"El error clásico del español: aquí usamos el pretérito perfecto por costumbre regional. En inglés no es costumbre, es regla. Si dices <b>cuándo</b> y ya acabó → past simple. Si no lo dices, o sigue siendo verdad → present perfect. Nunca «I have worked there <s>yesterday</s>».",
  ex:[
    {ok:1,t:"I <em>worked</em> at the university in 2025. (terminado)"},
    {ok:1,t:"I <em>have worked</em> in IT support for two years. (sigue)"},
    {ok:1,t:"I <em>have already sent</em> the report. (efecto ahora)"},
    {ok:0,t:"I <s>have finished</s> the course last year. → I <em>finished</em> it last year."}
  ],
  drills:[
    {q:"I ___ (start) working there in March.", a:["started"]},
    {q:"I ___ (work) there since March.", a:["have worked","'ve worked","have been working"]},
    {q:"___ you ever ___ (use) Linux at work?  → escribe solo el verbo", a:["used"]}
  ]
},
{
  id:"continuous", head:"present simple / present continuous", pos:"tense.",
  rule:"Present simple = hábito o situación permanente. Present continuous = ahora mismo o una etapa temporal. Los verbos de estado (know, want, need, like, believe, understand) no van en continuous.",
  es:"«Trabajo en Madrid» (mi empleo) = <b>I work in Madrid</b>. «Estoy trabajando en un script» (ahora) = <b>I'm working on a script</b>. Y ojo: para «llevo aquí desde 2026» NO se usa el continuous simple, sino <b>I've been working here since 2026</b>.",
  ex:[
    {ok:1,t:"I <em>work</em> for a real-estate agency. (empleo)"},
    {ok:1,t:"I'<em>m learning</em> English at the moment. (etapa)"},
    {ok:0,t:"I <s>am knowing</s> the answer. → I <em>know</em> the answer."},
    {ok:0,t:"I <s>am working</s> here since March. → I'<em>ve been working</em> here since March."}
  ],
  drills:[
    {q:"Right now I ___ (fix) a laptop.", a:["am fixing","'m fixing","m fixing"]},
    {q:"I usually ___ (start) at nine.", a:["start"]},
    {q:"I ___ (want) to improve my English.", a:["want"]}
  ]
},
{

let voice = null;
function loadVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(function(v){return /en[-_]GB/i.test(v.lang);}) ||
          vs.find(function(v){return /en[-_]US/i.test(v.lang);}) ||
          vs.find(function(v){return /^en/i.test(v.lang);}) || null;
}

  loadVoice();
  speechSynthesis.onvoiceschanged = loadVoice;
}
function say(text, rate){
  if(!("speechSynthesis" in window)) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(voice) u.voice = voice;
  u.lang = voice ? voice.lang : "en-GB";
  u.rate = rate || 0.92;
  speechSynthesis.speak(u);
  return true;
}

function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[’']/g,"'")
    .replace(/[.,;:!?¿¡"“”()]/g,"")
    .replace(/\s+/g," ").trim();
}
function words(s){ return norm(s).split(" ").filter(Boolean); }

/* word-level diff, longest common subsequence */
function diff(target, given){
  const a = words(target), b = words(given);
  const m = a.length, n = b.length;
  const L = [];
  for(let i=0;i<=m;i++){ L.push(new Array(n+1).fill(0)); }
  for(let i=m-1;i>=0;i--){
    for(let j=n-1;j>=0;j--){
      L[i][j] = a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
    }
  }
  const out = []; let i=0, j=0, hit=0;
  while(i<m && j<n){
    if(a[i]===b[j]){ out.push({k:"keep", w:a[i]}); hit++; i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]){ out.push({k:"miss", w:a[i]}); i++; }
    else { out.push({k:"extra", w:b[j]}); j++; }
  }
  while(i<m){ out.push({k:"miss", w:a[i++]}); }
  while(j<n){ out.push({k:"extra", w:b[j++]}); }
  return {parts:out, hit:hit, total:m};
}
function renderDiff(d){
  return d.parts.map(function(p){
    if(p.k==="keep") return '<span class="keep">'+p.w+'</span>';
    if(p.k==="miss") return '<span class="miss">'+p.w+'</span>';
    return '<span class="extra">'+p.w+'</span>';
  }).join(" ");
}
function pickN(arr, n, seed){
  const copy = arr.slice();
  const out = [];
  let s = seed || 1;
  while(copy.length && out.length < n){
    s = (s*9301 + 49297) % 233280;
    out.push(copy.splice(Math.floor((s/233280)*copy.length),1)[0]);
  }
  return out;
}
function daySeed(){
  const k = todayKey().replace(/-/g,"");
  return parseInt(k.slice(-5),10) || 7;
}

/* Misspellings driven by Spanish: doubled consonants that are single in
   Spanish, and single ones that should be doubled. */
const SPELL = {
  preffer:"prefer", prefered:"preferred", awnser:"answer", awnsers:"answers", awnswer:"answer", awnswers:"answers",
  ejample:"example", becouse:"because", becuase:"because", diferent:"different",
  recomend:"recommend", recomendation:"recommendation", comunication:"communication",
  comunicate:"communicate", posible:"possible", profesional:"professional",
  necesary:"necessary", neccesary:"necessary", responsability:"responsibility",
  oportunity:"opportunity", inteligent:"intelligent", acomodation:"accommodation",
  adress:"address", comited:"committed", experiencie:"experience", carrer:"career",
  aproximately:"approximately", diferences:"differences", inmediately:"immediately",
  sucess:"success", sucessful:"successful", enviroment:"environment",
  developement:"development", independant:"independent", recieve:"receive",
  wich:"which", trough:"through", allways:"always", diary:"daily"
};

function localCheck(text){
  const hits = [], seen = {};
  TRAPS.forEach(function(t){
    t.re.lastIndex = 0;
    let m;
    while((m = t.re.exec(text)) !== null){
      const found = m[0].trim();
      const key = found.toLowerCase() + "|" + t.fix;
      if(!seen[key]){
        seen[key] = 1;
        hits.push({found:found, msg:t.msg, fix:t.fix, soft:!!t.soft});
      }
      if(m.index === t.re.lastIndex) t.re.lastIndex++;
    }
  });
  const seenWord = {};
  String(text).toLowerCase().replace(/[^a-z']+/g," ").split(" ").forEach(function(w){
    if(SPELL[w] && !seenWord[w]){
      seenWord[w] = 1;
      hits.push({found:w, msg:"Ortografía.", fix:SPELL[w], soft:false});
    }
  });
  return hits;
}

function claudePrompt(task, text){
  return "Corrígeme este texto en inglés. Soy hispanohablante de nivel B1 y quiero llegar a B2. "+
         "Dame el texto corregido, y después cada error con la regla explicada en español.\n\n"+
         "TAREA: " + task + "\n\nMI TEXTO:\n" + text;
}

function renderLocal(box, task, text){
  const hits = localCheck(text);
  const wrap = el("div","fbox local");
  wrap.appendChild(el("div","eyebrow","quick check · no necesita conexión"));
  if(!hits.length){
    wrap.appendChild(el("div","muted","Ninguno de tus fallos habituales aparece aquí. Esto solo mira patrones concretos: que no salte nada no quiere decir que esté perfecto."));
  }else{
    const hard = hits.filter(function(h){return !h.soft;}).length;
    wrap.appendChild(el("div","muted", hard ? (hard + (hard===1?" cosa que revisar":" cosas que revisar") + (hits.length>hard ? " y algún aviso" : "")) : "Solo avisos, nada claramente mal."));
    hits.forEach(function(h){
      const r = el("div","note");
      r.appendChild(el("span", h.soft ? "v" : "x", escapeHtml(h.found)));
      r.appendChild(el("span","v", escapeHtml(h.fix)));
      r.appendChild(el("span","w", h.msg));
      wrap.appendChild(r);
    });
  }
  if(!sampleFn){
    const bar = el("div","row");
    bar.style.marginTop = "4px";
    const cp = el("button","btn ghost","Copy it for Claude");
    cp.onclick = function(){
      const payload = claudePrompt(task, text);
      const done = function(){
        cp.textContent = "Copied — now paste it to Claude";
        setTimeout(function(){ cp.textContent = "Copy it for Claude"; }, 3000);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(payload).then(done, function(){ fallbackCopy(payload, done); });
      }else{ fallbackCopy(payload, done); }
    };
    bar.appendChild(cp);
    bar.appendChild(el("span","muted","Para la corrección completa, pégalo en Claude."));
    wrap.appendChild(bar);
  }
  box.appendChild(wrap);
}

function fallbackCopy(txt, done){
  const ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}

    [(S.grammarDone||[]).length + "/" + CONFUSABLES.length,"confusables"]
  ].forEach(function(p){
    const d = el("div");
    d.appendChild(el("b",null,String(p[0])));
    d.appendChild(el("span",null,p[1]));
    tally.appendChild(d);
  });
  m.appendChild(tally);

  m.appendChild(el("hr","rule"));
  m.appendChild(el("div","eyebrow","the honest part"));
  m.appendChild(el("p",null,"Cambiar el móvil al inglés no te va a subir de nivel: reconoces «Settings» y poco más. Lo que mueve la aguja es <b>producir</b> — hablar y escribir — y que alguien te corrija. Por eso los bloques de hablar y escribir son los que llevan corrección, y el de escuchar es el que hace el trabajo silencioso. El <b>quick check</b> funciona siempre, sin conexión; la corrección completa solo cuando abres esto dentro de Claude."));
  m.appendChild(el("p","muted","Si algún día solo tienes cinco minutos, haz el de hablar. Es el que se evalúa en una entrevista."));
}

/* ---------- LISTEN ---------- */
function viewListen(m){
  m.appendChild(el("div","eyebrow","listen & write"));
  m.appendChild(el("h2",null,"Dictation"));
  m.appendChild(el("p","lead","Dale a <b>Play</b>, escribe lo que oigas y comprueba. Puedes repetirlo, pero no lo leas antes: el objetivo es el oído, no la lectura."));

  if(!("speechSynthesis" in window)){
    m.appendChild(el("div","warn","Este navegador no puede leer en voz alta. Prueba en Chrome o Edge."));
  }

  const set = pickN(DICTATION, 5, daySeed());
  let solved = 0;

  set.forEach(function(item, idx){
    const p = el("div","panel");
    p.style.marginBottom = "12px";
    const top = el("div","row");
    top.appendChild(el("span","ctx-tag", CTX_LABEL[item.c] || item.c));
    top.appendChild(el("span","score","#"+(idx+1)));
    top.appendChild(el("div","spacer"));
    const play = el("button","btn ghost","▶  Play");
    const slow = el("button","mini","slow");
    play.onclick = function(){ say(item.t, 0.92); };
    slow.onclick = function(){ say(item.t, 0.65); };
    top.appendChild(slow); top.appendChild(play);
    p.appendChild(top);

    const inp = el("input");
    inp.type = "text"; inp.id = "dict-"+idx;
    inp.placeholder = "Type what you hear…";
    inp.autocapitalize = "sentences"; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.style.marginTop = "12px";
    p.appendChild(inp);

    const out = el("div","");
    out.style.marginTop = "10px";
    p.appendChild(out);

    const bar = el("div","row");
    bar.style.marginTop = "10px";
    const chk = el("button","btn","Check");
    const rev = el("button","mini","reveal");
    let checked = false;
    chk.onclick = function(){
      if(!inp.value.trim()) return;
      const d = diff(item.t, inp.value);
      const pct = d.total ? Math.round(100*d.hit/d.total) : 0;
      out.innerHTML = '<div class="score">'+pct+'% — <span class="miss" style="padding:0 3px">verde</span> = te lo dejaste · <span class="extra" style="padding:0 3px">rojo</span> = sobra</div>'+
                      '<div class="diff" style="margin-top:6px">'+renderDiff(d)+'</div>'+
                      '<div class="muted" style="margin-top:8px">'+escapeHtml(item.t)+'</div>';
      if(!checked){
        checked = true; solved++;
        S.dictDone = (S.dictDone||0)+1;
        save();
        if(solved >= 4) markBlock("listen");
      }
    };
    rev.onclick = function(){ out.innerHTML = '<div class="muted">'+escapeHtml(item.t)+'</div>'; };
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter") chk.onclick(); });
    bar.appendChild(chk); bar.appendChild(rev);
    p.appendChild(bar);
    m.appendChild(p);
  });

  m.appendChild(el("p","muted","Las cinco frases cambian cada día. Con cuatro corregidas, el bloque cuenta como hecho."));
}

/* ---------- SPEAK ---------- */
function viewSpeak(m){
  m.appendChild(el("div","eyebrow","say it out loud"));
  m.appendChild(el("h2",null,"Speaking"));
  m.appendChild(el("p","lead","Contesta <b>en voz alta</b>, aunque estés solo y te dé vergüenza. Después escribe lo que has dicho — o dicta con el micrófono si tu navegador lo permite — y pídele la corrección."));

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const set = pickN(SPEAK, 2, daySeed()+3);
  let done = 0;

  set.forEach(function(item, idx){
    const p = el("div","panel");
    p.style.marginBottom = "14px";
    const top = el("div","row");
    top.appendChild(el("span","ctx-tag", CTX_LABEL[item.c] || item.c));
    top.appendChild(el("div","spacer"));
    const hear = el("button","mini","hear the question");
    hear.onclick = function(){ say(item.p, 0.95); };
    top.appendChild(hear);
    p.appendChild(top);

    p.appendChild(el("h3",null,escapeHtml(item.p)));
    p.appendChild(el("div","muted",item.hint));

    const ta = el("textarea");
    ta.id = "speak-"+idx;
    ta.placeholder = "Write what you said…";
    ta.style.marginTop = "12px";
    ta.style.minHeight = "110px";
    p.appendChild(ta);

    const bar = el("div","row");
    bar.style.marginTop = "10px";
    const chk = el("button","btn","Check my English");
    bar.appendChild(chk);

    if(SR){
      const mic = el("button","btn ghost","🎙  Dictate");
      let rec = null, listening = false;
      mic.onclick = function(){
        if(listening && rec){ rec.stop(); return; }
        try{
          rec = new SR();
          rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = true;
          const base = ta.value ? ta.value + " " : "";
          rec.onresult = function(e){
            let s = "";
            for(let i=0;i<e.results.length;i++) s += e.results[i][0].transcript;
            ta.value = base + s;
          };
          rec.onerror = function(){ listening = false; mic.textContent = "🎙  Dictate"; };
          rec.onend = function(){ listening = false; mic.textContent = "🎙  Dictate"; };
          rec.start();
          listening = true; mic.textContent = "■  Stop";
        }catch(err){ mic.disabled = true; }
      };
      bar.appendChild(mic);
    }
    p.appendChild(bar);

    const box = el("div","");
    box.style.marginTop = "12px";
    p.appendChild(box);

    chk.onclick = async function(){
      const v = ta.value.trim();
      if(v.length < 12){ box.innerHTML = '<div class="warn">Escribe al menos una frase entera antes de pedir corrección.</div>'; return; }
      chk.disabled = true;
      box.innerHTML = "";
      renderLocal(box, item.p, v);
      if(sampleFn){
        const deep = el("div","");
        deep.style.marginTop = "12px";
        box.appendChild(deep);
        await checkEnglish("Respuesta hablada a: " + item.p, v, deep);
      }
      chk.disabled = false;
      done++;
      S.speakDone = (S.speakDone||0)+1;
      save();
      if(done >= 2 || set.length === 1) markBlock("speak");
    };
    m.appendChild(p);
  });

  if(!SR){
    m.appendChild(el("div","warn","Este navegador no tiene dictado por micrófono. En Chrome o Edge te saldrá el botón 🎙. Mientras tanto, di la respuesta en voz alta y luego escríbela: el trabajo de hablar ya lo has hecho."));
  }
  m.appendChild(el("p","muted","Un truco que duele y funciona: grábate con el móvil diciendo la respuesta y escúchate. Oír tus propios errores es lo que más rápido los quita."));
}

/* ---------- WRITE ---------- */
function viewWrite(m){
  m.appendChild(el("div","eyebrow","write & get corrected"));
  m.appendChild(el("h2",null,"Writing"));
  m.appendChild(el("p","lead","Elige una tarea, escríbela sin traductor y pide la corrección. El valor está en ver <b>por qué</b> estaba mal, no en el texto corregido."));

  const sel = el("div","row");
  sel.style.marginBottom = "16px";
  let chosen = 0;
  const panel = el("div","panel");

  function draw(){
    const item = WRITE[chosen];
    panel.innerHTML = "";
    const top = el("div","row");
    top.appendChild(el("span","ctx-tag", CTX_LABEL[item.c] || item.c));
    panel.appendChild(top);
    panel.appendChild(el("h3",null,escapeHtml(item.p)));
    panel.appendChild(el("div","muted",item.hint));

    const ta = el("textarea");
    ta.id = "write-area";
    ta.placeholder = "Write in English…";
    ta.style.marginTop = "12px";
    panel.appendChild(ta);

    const bar = el("div","row");
    bar.style.marginTop = "10px";
    const chk = el("button","btn","Check my English");
    const count = el("span","muted","0 words");
    ta.addEventListener("input", function(){
      const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
      count.textContent = n + " word" + (n===1?"":"s");
    });
    bar.appendChild(chk); bar.appendChild(count);
    panel.appendChild(bar);

    const box = el("div","");
    box.style.marginTop = "14px";
    panel.appendChild(box);

    chk.onclick = async function(){
      const v = ta.value.trim();
      if(v.length < 20){ box.innerHTML = '<div class="warn">Escribe un poco más — con dos frases no hay nada que corregir.</div>'; return; }
      chk.disabled = true;
      box.innerHTML = "";
      renderLocal(box, item.p, v);
      if(sampleFn){
        const deep = el("div","");
        deep.style.marginTop = "12px";
        box.appendChild(deep);
        await checkEnglish(item.p, v, deep);
      }
      chk.disabled = false;
      S.writeDone = (S.writeDone||0)+1;
      save();
    };
  }

  WRITE.forEach(function(w, i){
    const b = el("button","mini", CTX_LABEL[w.c] + " " + (i+1));
    b.onclick = function(){ chosen = i; draw(); };
    sel.appendChild(b);
  });
  m.appendChild(sel);
  m.appendChild(panel);
  draw();
}

/* ---------- READ ---------- */
function viewRead(m){
  m.appendChild(el("div","eyebrow","read & understand"));
  m.appendChild(el("h2",null,"Reading"));
  m.appendChild(el("p","lead","Léelo entero antes de mirar el vocabulario. Adivinar por contexto es parte del examen."));

  READINGS.forEach(function(r){
    const p = el("div","panel");
    p.style.marginBottom = "16px";
    const top = el("div","row");
    top.appendChild(el("span","ctx-tag", CTX_LABEL[r.tag] || r.tag));
    top.appendChild(el("div","spacer"));
    const hear = el("button","mini","read it to me");
    hear.onclick = function(){
      const tmp = document.createElement("div");
      tmp.innerHTML = r.body;
      say(tmp.textContent, 0.9);
    };
    top.appendChild(hear);
    p.appendChild(top);

    p.appendChild(el("h3",null,escapeHtml(r.title)));
    p.appendChild(el("div","reader", r.body));

    p.appendChild(el("div","eyebrow","vocabulary"));
    const g = el("div","gloss");
    r.gloss.forEach(function(pair){
      g.appendChild(el("div",null,"<b>"+escapeHtml(pair[0])+"</b> — <i>"+escapeHtml(pair[1])+"</i>"));
    });
    p.appendChild(g);

    const qwrap = el("div","");
    qwrap.style.marginTop = "18px";
    qwrap.appendChild(el("div","eyebrow","comprehension"));
    r.qs.forEach(function(q, qi){
      const d = el("div","drill");
      d.style.marginBottom = "8px";
      d.appendChild(el("div","q", escapeHtml(q.q)));
      const inp = el("input"); inp.type="text"; inp.id = "read-"+r.id+"-"+qi;
      inp.placeholder = "Answer in English…";
      const fb = el("div","fb");
      const b = el("button","mini","check");
      const check = function(){
        const v = norm(inp.value);
        if(!v) return;
        const ok = q.a.some(function(a){ return norm(a) === v || v.indexOf(norm(a)) >= 0 || norm(a).indexOf(v) >= 0; });
        fb.className = "fb " + (ok ? "good" : "bad");
        fb.textContent = ok ? "✓ Right." : "✗ Not quite — " + q.a[0];
        if(ok && (S.readDone||[]).indexOf(r.id) < 0){ S.readDone = (S.readDone||[]).concat([r.id]); save(); }
      };
      b.onclick = check;
      inp.addEventListener("keydown", function(e){ if(e.key==="Enter") check(); });
      const row = el("div","row"); row.appendChild(inp); row.appendChild(b);
      d.appendChild(row); d.appendChild(fb);
      qwrap.appendChild(d);
    });
    p.appendChild(qwrap);
    m.appendChild(p);
  });
}

/* ---------- GRAMMAR ---------- */
function viewGrammar(m){
  m.appendChild(el("div","eyebrow","the confusables · "+CONFUSABLES.length+" entries"));
  m.appendChild(el("h2",null,"Grammar"));
  m.appendChild(el("p","lead","Tu problema no es «la gramática»: es una lista concreta de pares que en español son una sola cosa y en inglés son dos. Esta lista se acaba. Marca uno al día y en tres semanas los has visto todos."));

  const suggested = CONFUSABLES.filter(function(c){ return (S.grammarDone||[]).indexOf(c.id) < 0; })[0];
  if(suggested){
    const s = el("div","panel");
    s.style.marginBottom = "20px";
    s.appendChild(el("div","eyebrow","today's entry"));
    s.appendChild(el("div","headword", suggested.head));
    const b = el("button","btn ghost","Open it");
    b.style.marginTop = "10px";
    b.onclick = function(){
      const d = document.getElementById("gram-"+suggested.id);
      if(d){ d.open = true; d.scrollIntoView({behavior:"smooth", block:"start"}); }
    };
    s.appendChild(b);
    m.appendChild(s);
  }

  const list = el("div","panel");
  CONFUSABLES.forEach(function(c){
    const det = el("details","entry");
    det.id = "gram-"+c.id;
    const sum = el("summary");
    sum.appendChild(el("span","headword", c.head));
    sum.appendChild(el("span","pos", c.pos));
    if((S.grammarDone||[]).indexOf(c.id) >= 0) sum.appendChild(el("span","seen","seen"));
    det.appendChild(sum);

    const body = el("div","body");
    body.appendChild(el("div","rule-txt", c.rule));
    body.appendChild(el("div","es-note", c.es));

    const ul = el("ul","ex");
    c.ex.forEach(function(e){
      const li = el("li", e.ok ? "ok" : "no", e.t);
      ul.appendChild(li);
    });
    body.appendChild(ul);

    c.drills.forEach(function(dr, di){
      const d = el("div","drill");
      d.appendChild(el("div","q", dr.q.replace(/___/g,"<b>___</b>")));
      const inp = el("input"); inp.type = "text"; inp.id = "gd-"+c.id+"-"+di;
      inp.placeholder = "…"; inp.autocomplete = "off";
      const fb = el("div","fb");
      const btn = el("button","mini","check");
      const check = function(){
        const v = norm(inp.value);
        if(!v) return;
        const ok = dr.a.some(function(a){ return norm(a) === v; });
        fb.className = "fb " + (ok ? "good" : "bad");
        fb.textContent = ok ? "✓ Right." : "✗ " + dr.a[0];
        if(ok){
          if((S.grammarDone||[]).indexOf(c.id) < 0){
            S.grammarDone = (S.grammarDone||[]).concat([c.id]);
            if(!sum.querySelector(".seen")) sum.appendChild(el("span","seen","seen"));
          }
          markBlock("grammar");
          save();
        }
      };
      btn.onclick = check;
      inp.addEventListener("keydown", function(e){ if(e.key==="Enter") check(); });
      const row = el("div","row"); row.appendChild(inp); row.appendChild(btn);
      d.appendChild(row); d.appendChild(fb);
      body.appendChild(d);
    });

    det.appendChild(body);
    list.appendChild(det);
  });
  m.appendChild(list);
}

  INTERVIEW.forEach(function(it, i){

    "I'm <s>a person very responsible</s> → I'm a very responsible person. (adjetivo antes del nombre)",
    "I <s>have</s> 24 years → I'<em>m</em> 24 years old.",
    "<s>Actually</s> I work at an agency → <em>Currently</em> I work at an agency.",
    "I <s>have finished</s> my degree last year → I <em>finished</em> my degree last year."
  ].forEach(function(t){ bad.appendChild(el("li","no",t)); });
  m.appendChild(bad);
}

    if(db){
      dbRef = db.doc("progress/main");
      const snap = await dbRef.get();
      if(snap.exists){
        const remote = snap.data() || {};
        const localTotal = (S.dictDone||0)+(S.speakDone||0)+(S.writeDone||0);
        const remoteTotal = (remote.dictDone||0)+(remote.speakDone||0)+(remote.writeDone||0);
        if(remoteTotal >= localTotal){
          S = Object.assign({}, DEF, remote);
          localSave();
          paintStreak();
          render();
        }else{
          save();
        }
      }
    }
  }catch(e){}
  try{
    const s = await window.claude.use("sample");
    if(s){ sampleFn = s; if(current==="write"||current==="speak") render(); }
  }catch(e){}
})();
